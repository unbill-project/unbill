[package]
name = "unbill-console"
description = "The console library for unbill — CRDT ledger operations and P2P sync."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
unbill-build-info = { path = "../unbill-build-info", version = "0.0.9" }
unbill-console-verified = { path = "verified", version = "0.0.9" }
unbill-model = { path = "../unbill-model", version = "0.0.9" }
unbill-event = { path = "../unbill-event", version = "0.0.9" }
unbill-asymmetric-channel = { path = "../unbill-asymmetric-channel", version = "0.0.9" }
automerge.workspace = true
autosurgeon.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
ulid.workspace = true
iso_currency.workspace = true
garde.workspace = true
thiserror.workspace = true
tracing.workspace = true
qrcode.workspace = true
# The emoji dataset is part of the fingerprint encoding contract.
emojis = "=0.9.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen-futures.workspace = true


[dev-dependencies]
unbill-model = { path = "../unbill-model", version = "0.0.9", features = ["test-helpers"] }
unbill-storage = { path = "../unbill-storage", version = "0.0.9" }
unbill-store-memory = { path = "../unbill-store-memory", version = "0.0.9" }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tempfile = "3"
