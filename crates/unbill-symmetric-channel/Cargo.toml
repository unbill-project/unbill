[package]
name = "unbill-symmetric-channel"
description = "Symmetric channel for unbill — Iroh endpoint, device-to-device sync and join protocols."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-helpers = []

[dependencies]
unbill-model = { path = "../unbill-model", version = "0.0.9" }
unbill-storage = { path = "../unbill-storage", version = "0.0.9" }
iroh.workspace = true
iroh-mdns-address-lookup = "0.6"
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "io-util"] }
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
automerge.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "linux", target_os = "android"))'.dependencies]
iroh-ble-transport = "=0.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tracing-subscriber.workspace = true
unbill-model = { path = "../unbill-model", version = "0.0.9", features = ["test-helpers"] }
unbill-store-memory = { path = "../unbill-store-memory", version = "0.0.9" }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "test-util"] }
