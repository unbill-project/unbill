[package]
name = "unbill-asymmetric-channel"
description = "Asymmetric channel trait for unbill — the device-to-console protocol contract."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# In-process implementation backed directly by device storage.
local = ["dep:unbill-storage", "dep:unbill-symmetric-channel", "dep:unbill-event", "dep:automerge", "tokio/rt"]
# HTTP client calling unbill-server.
http = ["dep:reqwest", "dep:serde_json"]
# tarpc RPC server + client.
rpc = ["dep:tarpc", "dep:tokio-stream", "dep:serde_json", "dep:futures-util", "tokio/rt"]

[dependencies]
unbill-model = { path = "../unbill-model" }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync"] }

# local
unbill-storage = { path = "../unbill-storage", optional = true }
unbill-symmetric-channel = { path = "../unbill-symmetric-channel", optional = true }
unbill-event = { path = "../unbill-event", optional = true }
automerge = { workspace = true, optional = true }

# http-client
reqwest = { workspace = true, optional = true }

# http-client + rpc
serde_json = { workspace = true, optional = true }

# rpc
tokio-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tarpc = { workspace = true, optional = true }
