[package]
name = "unbill-device"
description = "Device-side service for unbill — implements the AsymChannel contract over a local store."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-helpers = ["unbill-symmetric-channel/test-helpers"]

[dependencies]
unbill-model = { path = "../unbill-model", version = "0.0.10" }
unbill-event = { path = "../unbill-event", version = "0.0.10" }
unbill-storage = { path = "../unbill-storage", version = "0.0.10" }
unbill-symmetric-channel = { path = "../unbill-symmetric-channel", version = "0.0.10" }
automerge.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
unbill-model = { path = "../unbill-model", version = "0.0.10", features = ["test-helpers"] }
unbill-store-memory = { path = "../unbill-store-memory", version = "0.0.10" }
tokio = { workspace = true, features = ["rt", "macros"] }
