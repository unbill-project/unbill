[package]
name = "unbill-store-fs"
description = "Flat-file LedgerStore implementation for unbill."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
unbill-storage = { path = "../unbill-storage" }
unbill-model = { path = "../unbill-model" }
unbill-event = { path = "../unbill-event" }
async-trait.workspace = true
directories.workspace = true
iroh.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["fs", "rt", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
