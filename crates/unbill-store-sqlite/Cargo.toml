[package]
name = "unbill-store-sqlite"
description = "Diesel SQLite LedgerStore implementation for unbill."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
unbill-storage = { path = "../unbill-storage" }
unbill-model = { path = "../unbill-model" }
unbill-event = { path = "../unbill-event" }
async-trait.workspace = true
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
iroh.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
unbill-store-fs = { path = "../unbill-store-fs" }
unbill-store-memory = { path = "../unbill-store-memory" }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
