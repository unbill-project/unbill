[lake]
# Sirno Lake path, resolved relative to this config file.
path = ".sirno/lake"
# Paths in lake that Sirno skips while reading, checking, querying, and rendering footers.
ignore = [".obsidian"]

[upstreams.core]
# Git-backed upstream lake crystallized into a glacier under this entry domain.
# Optional manifest selects the upstream project config file.
# Optional mist selects the imported portion from the upstream project.
git = "https://github.com/LighghtEeloo/sirno"
branch = "main"
manifest = "core/Sirno.toml"

[repo]
# Repository files, directories, or globs scanned for witness blocks.
members = ["Sirno.toml", "README.md", "INSTALL.md", "Cargo.toml", "Dockerfile", "release.toml", "LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "flake.nix", "devenv.nix", "devenv.yaml", "prek.toml", "rustfmt.toml", ".github/workflows/*.yml", ".github/aur/*/PKGBUILD", ".github/homebrew/*/install.rb", "apps/**/*.rs", "apps/**/*.toml", "apps/**/*.html", "apps/**/*.css", "apps/**/*.js", "crates/**/*.rs", "crates/**/*.toml", "crates/**/*.json", "crates/**/*.yml", "docker/*", "example-deployment/*.yml"]

[witness]
# Witness delimiter regex pairs; each first capture group is the entry address.
# Canonical entry-address capture: ([^\x00-\x1F\x7F<>:"/\\|?*,\r\n]+)
[[witness.delimiters]]
begin = '(?m)^[ \t]*//[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):begin'
end = '(?m)^[ \t]*//[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):end'

[[witness.delimiters]]
begin = '(?m)^[ \t]*<!--[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):begin[ \t]*-->'
end = '(?m)^[ \t]*<!--[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):end[ \t]*-->'

[[witness.delimiters]]
begin = '(?m)^[ \t]*#[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):begin'
end = '(?m)^[ \t]*#[ \t]*sirno:witness:([^\x00-\x1F\x7F<>:"/\\|?*\r\n]+):end'
