# sirno:witness:workspace-layout:begin
[workspace]
resolver = "2"
members = [
    "apps/unbill-cli",
    "apps/unbill-daemon",
    "apps/unbill-server",
    "apps/unbill-tui",
    "apps/unbill-ui-native",
    "apps/unbill-ui-remote",
    "crates/unbill-asymmetric-channel",
    "crates/unbill-device",
    "crates/unbill-console",
    "crates/unbill-console/verified",
    "crates/unbill-event",
    "crates/unbill-symmetric-channel",
    "crates/unbill-model",
    "crates/unbill-model/verified",
    "crates/unbill-storage",
    "crates/unbill-store-fs",
    "crates/unbill-store-memory",
    "crates/unbill-tauri",
    "crates/unbill-ui-components",
    "crates/unbill-ffi",
]
# sirno:witness:workspace-layout:end

# sirno:witness:distribution-and-release:begin
[workspace.package]
version = "0.0.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unbill-project/unbill"
homepage = "https://github.com/unbill-project/unbill"
description = "Shared bill tracking"
publish = false
# sirno:witness:distribution-and-release:end

[workspace.dependencies]
# CRDT
automerge = "0.8"
autosurgeon = "0.11"

# Networking
iroh = { version = "0.98", features = ["address-lookup-mdns"] }

# Async
tokio = { version = "1.52.1", default-features = false, features = ["sync"] }
async-trait = "0.1"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# IDs
ulid = "1"

# Domain types
iso_currency = "0.5"
rand = "0.10.1"

# Validation
garde = { version = "0.22", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# QR code
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Utilities
dashmap = "6"
directories = "6.0.0"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# HTTP server
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }

# Streams / async utilities
tokio-stream = "0.1"
futures-util = "0.3"

# RPC
tarpc = { version = "0.37", features = ["full"] }

# WASM (pinned — must match wasm-bindgen-cli in flake.nix)
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"

# Testing
proptest = "1"
wiremock = "0.6"

[profile.release]
lto = true

[profile.release.package.unbill-tui]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.


[profile.release.package.unbill-cli]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
