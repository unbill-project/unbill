name: Python Package

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/python.yml'
      - 'bindings/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/python.yml'
      - 'bindings/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

# sirno:witness:python-bindings:begin
jobs:
  linux:
    name: Wheel (Linux x86_64)
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select build Python
        run: echo '/opt/python/cp311-cp311/bin' >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-manylinux-2-28-x86_64
      - name: Generate release package
        run: |
          python bindings/python/test_packaging.py
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag_args=(--expected-tag "$GITHUB_REF_NAME")
          fi
          python bindings/python/build.py --release "${tag_args[@]}"
      - name: Build and repair wheel
        run: |
          python -m pip install 'setuptools>=77' wheel twine
          python -m pip wheel --no-build-isolation --no-deps target/python/release -w target/python/wheels
          auditwheel repair --plat manylinux_2_28_x86_64 -w wheelhouse target/python/wheels/*.whl
          python -m twine check --strict wheelhouse/*.whl
          python bindings/python/test_packaging.py wheelhouse
      - name: Test installed wheel on Python 3.9, 3.11, and 3.14
        run: |
          for python_tag in cp39-cp39 cp311-cp311 cp314-cp314; do
            interpreter="/opt/python/$python_tag/bin/python"
            "$interpreter" -m pip install --no-index --no-deps wheelhouse/*.whl
            "$interpreter" bindings/python/test_bindings.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-linux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  native:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.platform }}
      - name: Generate release package
        run: |
          python bindings/python/test_packaging.py
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag_args=(--expected-tag "$GITHUB_REF_NAME")
          fi
          python bindings/python/build.py --release "${tag_args[@]}"
      - name: Build wheel
        run: |
          python -m pip install 'setuptools>=77' wheel twine
          python -m pip wheel --no-build-isolation --no-deps target/python/release -w target/python/wheels
      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-wheel --require-archs arm64 -w wheelhouse target/python/wheels/*.whl
      - name: Repair Windows wheel
        if: runner.os == 'Windows'
        run: |
          python -m pip install delvewheel
          python -m delvewheel repair --analyze-existing -w wheelhouse target/python/wheels/*.whl
      - name: Check and test installed wheel on Python 3.9
        run: |
          python -m twine check --strict wheelhouse/*.whl
          python bindings/python/test_packaging.py wheelhouse
          python -m pip install --no-index --no-deps wheelhouse/*.whl
          python bindings/python/test_bindings.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test installed wheel on Python 3.14
        run: |
          python -m pip install --no-index --no-deps wheelhouse/*.whl
          python bindings/python/test_bindings.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [linux, native]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/unbill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
# sirno:witness:python-bindings:end
