name: Release Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.2.3)'
        required: true
        type: string
      packages:
        description: 'JSON array of Homebrew formula names (e.g. ["unbill-cli","unbill-tui"])'
        required: true
        type: string
      cask:
        description: 'Whether to publish the macOS desktop app cask'
        required: false
        type: boolean
        default: false
    secrets:
      HOMEBREW_TOKEN:
        description: 'Personal access token with repo scope for the homebrew tap'
        required: true

jobs:
  formula:
    name: Push ${{ matrix.package }} formula to Homebrew tap
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(inputs.packages) }}

    steps:
      - name: Download assets and compute checksums
        id: asset
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          PKG="${{ matrix.package }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          DARWIN_URL="${BASE}/${PKG}-macos-aarch64.tar.gz"
          LINUX_URL="${BASE}/${PKG}-linux-x86_64.tar.gz"
          curl -fSL -o darwin.tar.gz "$DARWIN_URL"
          curl -fSL -o linux.tar.gz "$LINUX_URL"
          {
            echo "darwin_url=$DARWIN_URL"
            echo "darwin_sha=$(sha256sum darwin.tar.gz | cut -d' ' -f1)"
            echo "linux_url=$LINUX_URL"
            echo "linux_sha=$(sha256sum linux.tar.gz | cut -d' ' -f1)"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          PKG="${{ matrix.package }}"
          CLASS=$(echo "$PKG" | sed 's/-\(.\)/\U\1/g; s/^\(.\)/\U\1/')
          mkdir -p Formula
          cat > "Formula/${PKG}.rb" << EOF
          class ${CLASS} < Formula
            desc "Unbill ${PKG}"
            homepage "https://github.com/${{ github.repository }}"
            version "${{ steps.asset.outputs.version }}"
            license "MIT"

            on_macos do
              on_arm do
                url "${{ steps.asset.outputs.darwin_url }}"
                sha256 "${{ steps.asset.outputs.darwin_sha }}"
              end
            end

            on_linux do
              on_intel do
                url "${{ steps.asset.outputs.linux_url }}"
                sha256 "${{ steps.asset.outputs.linux_sha }}"
              end
            end

            def install
              bin.install "${PKG}"
            end
          end
          EOF

      - name: Push formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          PKG="${{ matrix.package }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/unbill-project/homebrew-tap.git" tap
          cp "Formula/${PKG}.rb" "tap/Formula/${PKG}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${PKG}.rb"
          git diff --cached --quiet || git commit -m "Update ${PKG} to ${{ inputs.tag }}"
          git push

  cask:
    name: Push unbill cask to Homebrew tap
    if: inputs.cask
    runs-on: ubuntu-latest
    steps:
      - name: Get release asset URL and SHA256
        id: asset
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ inputs.tag }}"
          ASSET_NAME="unbill-macos-aarch64.dmg"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET_NAME}"
          curl -fSL -o asset.dmg "$URL"
          SHA=$(sha256sum asset.dmg | cut -d' ' -f1)
          {
            echo "url=$URL"
            echo "sha256=$SHA"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate cask file
        run: |
          mkdir -p Casks
          cat > Casks/unbill.rb << 'CASK'
          cask "unbill" do
            version "${{ steps.asset.outputs.version }}"
            sha256 "${{ steps.asset.outputs.sha256 }}"

            url "${{ steps.asset.outputs.url }}"
            name "Unbill"
            desc "Split bills with friends — offline-first, peer-to-peer"
            homepage "https://github.com/${{ github.repository }}"

            app "Unbill.app"
          end
          CASK

      - name: Push cask to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/unbill-project/homebrew-tap.git" tap
          cp Casks/unbill.rb tap/Casks/unbill.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/unbill.rb
          git diff --cached --quiet || git commit -m "Update unbill cask to ${{ inputs.tag }}"
          git push
