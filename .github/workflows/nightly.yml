name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# sirno:witness:ci-cd-pipeline:begin
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for changes since the last nightly
        id: nightly
        shell: bash
        run: |
          latest=$(git for-each-ref --sort=-refname --count=1 --format='%(refname)' 'refs/tags/nightly-????????-??????')
          if [[ -n "$latest" ]]; then
            latest_tree=$(git rev-parse "${latest}^{tree}")
            current_tree=$(git rev-parse 'HEAD^{tree}')
            if [[ "$latest_tree" == "$current_tree" ]]; then
              echo "No changes since ${latest#refs/tags/}; skipping nightly."
              exit 0
            fi
          fi

          echo "tag=nightly-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      build_apple_dmg: true
      build_apple_ios: true
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    needs: [prepare, build]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: true
      body: Automated nightly build from `main`. Not guaranteed to be stable.
      aur_packages: '["unbill-cli-nightly-bin","unbill-tui-nightly-bin","unbill-nightly-bin","unbill-daemon-nightly-bin"]'
    permissions:
      contents: write
      actions: read
    secrets: inherit
# sirno:witness:ci-cd-pipeline:end
