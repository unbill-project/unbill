name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# sirno:witness:ci-cd-pipeline:begin
jobs:
  sirno:
    name: Sirno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sirno
      - name: Install sirno
        run: cargo install --git https://github.com/LighghtEeloo/sirno --rev bf379b6b095ab67430e8146c919f2dfbdb1dd4e1 sirno --locked
      - name: Lake check
        run: sirno lake check --mode review
      - name: Anchor check
        run: sirno anchor check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install prek
        run: cargo install prek
      - name: prek run --all-files
        run: prek run --all-files

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --exclude unbill-tauri

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --exclude unbill-tauri
# sirno:witness:ci-cd-pipeline:end
