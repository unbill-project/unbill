name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# sirno:witness:ci-cd-pipeline:begin
jobs:
  sirno:
    name: Sirno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sirno
      - name: Install sirno
        run: cargo install --git https://github.com/LighghtEeloo/sirno --rev bf379b6b095ab67430e8146c919f2dfbdb1dd4e1 sirno --locked
      - name: Lake check
        run: sirno lake check --mode review
      - name: Anchor check
        run: sirno anchor check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install prek
        run: cargo install prek
      - name: prek run --all-files
        run: prek run --all-files

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          cargo fetch --locked
          cargo clippy --workspace --exclude unbill-tauri -- \
            -W clippy::arithmetic_side_effects \
            -W clippy::indexing_slicing \
            -W clippy::string_slice \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            -W clippy::unreachable \
            -W clippy::todo

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          cargo fetch --locked
          cargo test --workspace --exclude unbill-tauri

  rust-package:
    name: Rust package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-package
      - name: Package standalone Rust libraries
        run: |
          cargo fetch --locked
          python3 bindings/rust/test_packaging.py
          cargo tree -p unbill -e normal,build --prefix none > "$RUNNER_TEMP/rust-dependencies.txt"
          if grep -E '^uniffi([_-]| )' "$RUNNER_TEMP/rust-dependencies.txt"; then
            echo 'The native Rust package must not depend on UniFFI.' >&2
            exit 1
          fi
          python3 bindings/rust/package.py
# sirno:witness:ci-cd-pipeline:end
