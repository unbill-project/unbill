[package]
name = "unbill-server"
description = "HTTP storage server for unbill — implements the HttpStore REST API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "unbill-server"
path = "src/main.rs"

[lib]
name = "unbill_server"
path = "src/lib.rs"

[dependencies]
unbill-device = { path = "../../crates/unbill-device" }
unbill-model = { path = "../../crates/unbill-model" }
unbill-store-fs = { path = "../../crates/unbill-store-fs" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-stream.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true

[dev-dependencies]
unbill-storage = { path = "../../crates/unbill-storage" }
automerge.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
