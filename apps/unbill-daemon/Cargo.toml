[package]
name = "unbill-daemon"
description = "Background daemon that owns the Unbill device and serves the RPC channel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "unbill-daemon"
path = "src/main.rs"

[dependencies]
unbill-asymmetric-channel = { path = "../../crates/unbill-asymmetric-channel", features = ["local", "rpc"] }
unbill-store-fs = { path = "../../crates/unbill-store-fs" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
