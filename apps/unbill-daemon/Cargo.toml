[package]
name = "unbill-daemon"
description = "Background daemon that owns the Unbill device and serves the RPC channel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "unbill-daemon"
path = "src/main.rs"

[dependencies]
build-info.workspace = true
unbill-build-info = { path = "../../crates/unbill-build-info" }
unbill-asymmetric-channel = { path = "../../crates/unbill-asymmetric-channel", features = ["local", "rpc"] }
unbill-device = { path = "../../crates/unbill-device" }
unbill-storage = { path = "../../crates/unbill-storage" }
unbill-store-sqlite = { path = "../../crates/unbill-store-sqlite" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
chrono.workspace = true
build-info-build.workspace = true
